                    type: integer
                    description: The quantity of the item in stock
                    default: 0
                    example: 1

        InventoryStockReportItemSchema:
            type: object
            properties:
                itemId:
                    type: string
                    description: The UID of the Item
                ident:
                    type: string
                    description: The ident of the item
                    example: 'PART-001'
                factoryRef:
                    type: string
                    description: The factory ident of the item
                thirdpartyRef:
                    type: string
                    description: The thirdparty ident of the item
                descrip:
                    type: string
                    description: The description of the item
                barcode:
                    type: string
                    description: The barcode of the item
                stock:
                    type: number
                    description: The current stock level of the item
                    example: 12
                minStock:
                    type: number
                    description: The minimum stock level of the item
                    example: 5
                targetStock:
                    type: number
                    description: The target stock level of the item
                    example: 20
                category:
                    type: string
                    description: The item category name
                productBrand:
                    type: string
                    description: The product brand name
                models:
                    type: array
                    description: The product models linked to the item. Only returned by the in-stock report.
                    items:
                        type: string

        InventoryStockMovementSchema:
            type: object
            properties:
                movementId:
                    type: string
                    description: The UID of the stock movement
                createdAt:
                    type: string
                    description: ISO-8601 date the movement was recorded
                    example: "2022-04-10T14:30:00+02:00"
                user:
                    type: string
