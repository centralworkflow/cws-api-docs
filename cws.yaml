                updateReason:
                    type: string
                    description: The reason recorded against the movement, or Unknown
                qtyStock:
                    type: number
                    description: The stock quantity moved. Positive for additions, negative for deductions.
                    example: -1
                woRef:
                    type: string
                    description: The Work Order number the movement relates to, if any
                itemId:
                    type: string
                    description: The UID of the Item
                ident:
