    #----------------------------------------------------------------------------------------------------------------------- Work Order Group

    /groups/{groupId}/wos:
        get:
            summary: Get a list of all Work Orders in a Work Order Group.
            description: |
                Identical to GET /wos but the results are filtered to the given Work Order Group.
            tags:
                - Work Order Groups
            security:
                - bearerAuth: []
            parameters:
                - in: path
                  name: groupId
                  schema:
                      type: string
                  required: true
                  description: The UID of the Work Order Group
                - in: query
                  name: page
                  description: The current page number. Default 1.
                  schema:
                    type: integer
                    default: 1
                - in: query
                  name: pageSize
                  description: The number of workorders to return Default 20 Max 200
                  schema:
                    type: integer
                    default: 20
                    maximum: 200
                - in: query
                  name: sort
                  description: The sort direction
                  schema:
                      type: string
                      default: desc
                      enum: [asc, desc]
                - in: query
                  name: updatedFrom
                  schema:
                      type: string
                  description: ISO-8601 date - When the lookup should start (inclusive).
                  example: "2022-04-10T14:30:00+02:00"
                - in: query
                  name: updatedUntil
                  schema:
                      type: string
                  description: ISO-8601 date - When the lookup should end (inclusive).
                  example: "2022-04-10T14:30:00+02:00"
                - in: query
                  name: createdFrom
                  schema:
                      type: string
                  description: ISO-8601 date - When the lookup should start (inclusive).
                  example: "2022-04-10T14:30:00+02:00"
                - in: query
                  name: createdUntil
                  schema:
                      type: string
                  description: ISO-8601 date - When the lookup should end (inclusive).
                  example: "2022-04-10T14:30:00+02:00"
                - in: query
                  name: thirdpartyRef
                  schema:
                      type: string
                  description: A third party reference number to filter by
                - in: query
                  name: ref
                  schema:
                      type: string
                  description: A reference number to filter by
                - in: query
                  name: ids
                  schema:
                      type: string
                  example: E7rApNKbg4,Z7rApNKbg4,T7rApNKbg4
                  description: Specific Work Order IDs to filter the results by
            responses:
                '200':
                    $ref: '#/components/responses/ResponseWoListSuccess'
                '400':
                    $ref: '#/components/responses/ResponseErrorBadRequest'
                '500':
                    $ref: '#/components/responses/ResponseErrorInternal'
                '401':
                    $ref: '#/components/responses/ResponseErrorUnauthorized'
                '429':
                    $ref: '#/components/responses/ResponseErrorRateLimitExceeded'
        post:
            summary: Create a new Work Order in a Work Order Group

            tags:
                - Work Order Groups
            security:
                - bearerAuth: []
            parameters:
                - in: path
                  name: groupId
                  schema:
                      type: string
                  required: true
                  description: The UID of the Group
                - in: query
                  name: mode
                  schema:
                      type: string
                      enum: [all, queue, create]
                  description: |
                      **all** = If it is possible to create it in real-time a 201 response is returned, otherwise it is queued and a 202 response is returned.

                      **queue** = The Work Order is queued and a 202 response is returned.

                      **create** = The Work Order is created in real-time and a 201 response is returned. If it is not possible to create it in real-time a 400 response is returned.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/WoPostSchema'
            responses:
                '201':
                    $ref: '#/components/responses/ResponseWoSuccess'
                '202':
                    $ref: '#/components/responses/ResponseWoCreateSuccess'
                '400':
                    $ref: '#/components/responses/ResponseErrorBadRequest'
                '500':
                    $ref: '#/components/responses/ResponseErrorInternal'
                '401':
                    $ref: '#/components/responses/ResponseErrorUnauthorized'
                '429':
                    $ref: '#/components/responses/ResponseErrorRateLimitExceeded'

