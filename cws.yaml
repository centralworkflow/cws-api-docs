                                                type: integer
                                                description: The total number of pages
                                                example: 5
                                            pageSize:
                                                type: integer
                                                description: The size of each page
                                                example: 20
                                            page:
                                                type: integer
                                                description: The current page
                                                example: 1
                                            results:
                                                type: array
                                                items:
