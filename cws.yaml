openapi: 3.0.0
info:
    version: '1.0'
    title: CWS API Documentation
    description: |
        This is the documentation for the CWS REST API.

        ## Rate Limiting

        The API is rate limited to **60 requests per minute** and
        **1000 requests per hour**.

        Both limits are applied per API user, so your requests are not affected
        by other integrations. Endpoints that do not require authentication are
        limited per IP address instead.

        Each limit uses a sliding window rather than fixed clock minutes or
        hours, so allowance frees up continuously as older requests age out.
        Requests rejected for exceeding a limit do not consume quota in either
        window.

        Every response includes the following headers so you can track usage:

        | Header | Meaning |
        |--------|---------|
        | `X-RateLimit-Limit` | Total allowance (requests per minute) |
        | `X-RateLimit-Remaining` | Requests remaining in the current minute window |
        | `X-RateLimit-Reset` | Unix timestamp when minute allowance starts to free up |
        | `X-RateLimit-Limit-Hour` | Total allowance (requests per hour) |
        | `X-RateLimit-Remaining-Hour` | Requests remaining in the current hour window |
        | `X-RateLimit-Reset-Hour` | Unix timestamp when hour allowance starts to free up |

        When either limit is exceeded the API responds with HTTP **429 Too Many
        Requests** and a `Retry-After` header giving the number of seconds to
        wait before retrying (based on whichever window was exceeded). A steady
        rate just under the limits is always safe; avoid bursting and back off
        when a `Remaining` header approaches zero.
    contact:
        name: Link Technology
        email: systems@linktechnology.net

servers:
    - url: https://{systemId}.cws.app/api/v1/
      description: Production Server
    - url: https://{systemId}-trial.cws.app/api/v1/
      description: Test Server
tags:
    - name: Auth
      description: Authentication Operations
    - name: User
      description: Currenlty authorized User operations
    - name: Work Orders
      description: Specific Work Order operations
    - name: Work Order Statuses
      description: Work Order Status operations. Statuses are used to track the progress of a work order.
    - name: Work Order Logs
      description: Work Order Log operations. Logs are used to track the progress of a work order.
    - name: Work Order Parts
      description: Work Order Part operations. Parts are used to track the parts used on a work order.
    - name: Work Order Charges
      description: Work Order Charge operations. Charges are used to track the charges on a work order.
    - name: Work Order Groups
      description: Work Order Group operations. Groups are logical groupings of workorders, properties and rules.
    - name: Work Order Group Products
      description: Work Order Group Products operations.
    - name: Work Order Groups Faults
      description: Work Order Group Faults operations.
    - name: Inventory
      description: Inventory operations. Suppliers, factories and warehouses.
    - name: Inventory Supplier Items
      description: Inventory Supplier Item operations. Items are the parts and products a Supplier stocks.
    - name: Inventory Supplier Purchase Orders
      description: Inventory Supplier Purchase Order operations. Purchase Orders replenish a Supplier's stock.
    - name: Inventory Supplier Orders
      description: Inventory Supplier Order operations. Orders dispatch stock from a Supplier.
    - name: Inventory Supplier Stock Reports
      description: Inventory Supplier Stock Report operations. Current stock levels, low stock and the stock movement ledger.

    
paths:
    #----------------------------------------------------------------------------------------------------------------------- Auth

    /auth:
        post:
            summary: Create a new Access Token from Username and Password. 
            description: |
                - This endpoint is used to create a new Access Token from a Username and Password.
                - Only one Access Token can be requested each 10 minutes. 
                - The Access Token is used to authenticate the user for all other endpoints. 
                - The Access Token is valid for 1 day and can be refreshed for up to 90 days. 
                - The Refresh Token is used to request a new Access Token without needing to re-enter the Username and Password. 
                - The Refresh Token is valid for 90 days. 
                
                
            tags:
                - Auth
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - username
                                - password
                            properties:
                                username:
                                    type: string
                                    example: user@user.com
                                password:
                                    type: string
                                    example: mysecretpassword
            responses:
                '200':
                    $ref: '#/components/responses/ResponseToken'
                '400':
                    $ref: '#/components/responses/ResponseErrorBadRequest'
                '500':
                    $ref: '#/components/responses/ResponseErrorInternal'
                '401':
                    $ref: '#/components/responses/ResponseErrorUnauthorized'
                '429':
                    $ref: '#/components/responses/ResponseErrorRateLimitExceeded'

    /auth/all:
        post:
            summary: Create a new Access Token and return the User's details and permissions in one call.
            description: |
                - Identical to POST /auth, but the response also includes the authenticated User's details and permissions.
                - The token values are nested under `authConfig`.
                - The same authentication limits apply as POST /auth.
            tags:
                - Auth
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - username
                                - password
                            properties:
                                username:
                                    type: string
                                    example: user@user.com
                                password:
                                    type: string
                                    example: mysecretpassword
            responses:
                '200':
                    $ref: '#/components/responses/ResponseTokenAll'
                '400':
                    $ref: '#/components/responses/ResponseErrorBadRequest'
                '500':
                    $ref: '#/components/responses/ResponseErrorInternal'
                '401':
                    $ref: '#/components/responses/ResponseErrorUnauthorized'
                '429':
                    $ref: '#/components/responses/ResponseErrorRateLimitExceeded'

    /auth/refresh:
        post:
            summary: Refresh an existing access token
            tags:
                - Auth
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - refreshToken
                            properties:
                                refreshToken:
                                    type: string
                                    example: BqdmioqjlgaSBTIarf8coYFhZfBeqCn82AulZVEkbPdNIVYaa6ny43P4iriJ4FR7gmtgi8AtXOhGKfRVmfuqijvBLOkQtcXKyq0QyBkwqCdaR55dkzEDTaeFYyvsLtcj
            responses:
                '200':
                    $ref: '#/components/responses/ResponseToken'
                '400':
                    $ref: '#/components/responses/ResponseErrorBadRequest'
                '500':
                    $ref: '#/components/responses/ResponseErrorInternal'
                '401':
                    $ref: '#/components/responses/ResponseErrorUnauthorized'
                '429':
                    $ref: '#/components/responses/ResponseErrorRateLimitExceeded'

    #----------------------------------------------------------------------------------------------------------------------- User

    /user/session:
        get:
            summary: Get's information about the currenty authorized user
            tags:
