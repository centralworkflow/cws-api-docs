    /inventory/suppliers/{supplierId}/stock-movements:
        get:
            summary: Get the Stock Movements report
            description: |
                - Returns the Supplier's stock ledger. Each entry is a single stock movement (positive or negative), with its related Inventory Order, Work Order and Product where applicable.
                - Results are sorted by newest first by default.
            security:
              - bearerAuth: []
            tags:
                - Inventory Supplier Stock Reports
            parameters:
                - in: path
                  name: supplierId
                  required: true
