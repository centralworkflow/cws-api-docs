                    type: string
                    description: The product serial on the related Work Order


        #----------------------------------------------------------------------------------------------------------------------- Inventory Order Item

     

        

        WoSchema:
            type: object
            properties:
                ref:
                    type: string
                    example: 'myref'
                delayRef:
                    type: string
                    example: 'mydelayref'
                raRef:
                    type: string
                    example: 'myraref'
                raReason:
                    type: string
                    example: 'myrareason'
                productRef:
                    type: string
                    example: 'myproductref'
                stockRef:
                    type: string
                    example: 'mystockref'
                descrip:
                    type: string
                    example: 'mydescrip'
                instruct:
                    type: string
                    example: 'myinstruct'

        WoPostSchema:
            allOf:
                - $ref: '#/components/schemas/WoSchema'
                - type: object
                  required:
                      - thirdpartyRef
                  properties:
                      thirdpartyRef:
                          type: string
                          example: 'mythirdpartyref'
                      product:
                          $ref: '#/components/schemas/ProductSchema'
                      contacts:
                          type: object
                          required:
                              - customer
                          properties:
                              customer:
                                  $ref: '#/components/schemas/ContactGetSchema'

        WoPatchSchema:
            type: object
            properties:
                ref:
                    type: string
                    example: 'myref'
                thirdpartyRef:
                    type: string
                    example: 'third'
                externalApiRef:
                    type: string
                    example: 'abc123'
                delayRef:
                    type: string
                    example: 'mydelayref'
                raRef:
                    type: string
                    example: 'myraref'
                raReason:
                    type: string
                    example: 'myrareason'
                productRef:
                    type: string
                    example: 'myproductref'
                stockRef:
                    type: string
                    example: 'mystockref'
                stockInboundRef:
                    type: string
                    example: 'mystockinboundref'
                stockOutboundRef:
                    type: string
                    example: 'mystockoutboundref'
                descrip:
                    type: string
                    example: 'mydescrip'
                instruct:
                    type: string
                    example: 'myinstruct'
                product:
                    allOf:
                        - $ref: '#/components/schemas/ProductPatchSchema'
                        - type: object
                          properties:
                              fault:
                                  allOf:
                                      - $ref: '#/components/schemas/WoProductFaultSchema'
                                      - type: object
                                        properties:
                                            faultCode:
                                                type: string
                                                example: 'F123'

        WoListResponseSchema:
            type: object
            properties:
                totalCount:
                    type: integer
                    description: The total number of results, ignoring the page size
                    example: 100
                pageCount:
                    type: integer
                    description: The total number of pages
                    example: 5
                pageSize:
                    type: integer
                    description: The size of each page
                    example: 20
                page:
                    type: integer
                    description: The current page
                    example: 1
                results:
                    type: array
                    items:
                        $ref: '#/components/schemas/WoResponseSchema'
        WoResponseSchema:
            allOf:
                - $ref: '#/components/schemas/WoSchema'
                - type: object
                  required:
                      - id
                      - uid
                      - status
                      - createdAt
                      - updatedAt
                  properties:
                      id:
                          type: integer
                          description: Non-unique, sequential UID on a per-tenant basis
                          example: '12345'
                      uid:
                          type: string
                          example: 'E7rApNKbg4'
                      createdAt:
                          type: string
                          description: ISO-8601 date - The date the Work Order was created
                          example: '2021-04-10T14:30:00+02:00'
                      updatedAt:
                          type: string
                          description: ISO-8601 date - The date the Work Order was last updated
                          example: '2021-04-10T14:30:00+02:00'
                      closedAt:
                          type: string
                          nullable: true
                          description: ISO-8601 date - The date the Work Order was closed
                          example: '2021-04-10T14:30:00+02:00'
                      thirdpartyRef:
                          type: string
                          example: 'mythirdpartyref'
                      programRef:
                          type: string
                          example: 'myprogramref'
                      invoiceRef:
                          type: string
                          example: 'myinvoiceref'
                      stockInboundRef:
                          type: string
                          example: 'mystockinboundref'
                      stockOutboundRef:
                          type: string
                          example: 'mystockoutboundref'
                      priority:
                          type: string
                          example: 'High'
                      status:
                          $ref: '#/components/schemas/WoStatusInfoSchema'
                      contacts:
                          type: object
                          required:
                                - customer
                                - location
                          properties:
                              customer:
                                  $ref: '#/components/schemas/ContactResponseSchema'
                              delivery:
                                  $ref: '#/components/schemas/SimpleContactResponseSchema'
                              location:
                                  $ref: '#/components/schemas/SimpleContactResponseSchema'
                              groupScheme:
                                  description: Only present when the Work Order belongs to a Work Order Group
                                  $ref: '#/components/schemas/SimpleContactResponseSchema'
                      product:
                          nullable: true
                          description: The product on the Work Order. `null` for install Work Orders.
                          $ref: '#/components/schemas/ProductResponseSchema'
                      installProducts:
                          type: array
                          items:
                              $ref: '#/components/schemas/InstallProductResponseSchema'
                      files:
                          type: array
                          items:
                              $ref: '#/components/schemas/FileResponseSchema'
                      events:
                          type: array
                          items:
                              $ref: '#/components/schemas/EventResponseSchema'
                      logs:
                          type: array
                          items:
                              $ref: '#/components/schemas/LogResponseSchema'
        WoStatsResponseSchema:
            type: object
            properties:
                totalCount:
                    type: number
                    description: The total number of Work Orders
                    example: 100
                lastChangeAt:
                    type: string
                    description: ISO-8601 date - The date of the last change
                    example: "2022-04-10T14:30:00+02:00"
                firstWoId:
                    type: string
                    description: The UID of the first Work Order
                    example: Bqdmioqjlg
                firstWoNum:
                    type: number
                    description: The number of the first Work Order
                    example: 1
                lastWoId:
                    type: string
                    description: The UID of the last Work Order
                    example: Bqdmioqjlg
                lastWoNum:
                    type: number
                    description: The number of the last Work Order
                    example: 100
