                  schema:
                    type: integer
                    default: 1
                - in: query
                  name: pageSize
                  description: The number of movements to return Default 20 Max 200
                  schema:
                    type: integer
                    default: 20
                    maximum: 200
                - in: query
                  name: sort
                  description: The sort direction (by movement date)
                  schema:
                      type: string
                      default: desc
                      enum: [asc, desc]
                - in: query
                  name: movement
                  description: Filter by movement type. `manual` returns movements without an Inventory Order, `orders` returns movements linked to an Inventory Order.
                  schema:
                      type: string
                      default: all
                      enum: [all, manual, orders]
                - in: query
                  name: createdFrom
                  schema:
                      type: string
                  description: ISO-8601 date - When the lookup should start (inclusive).
                  example: "2022-04-10T14:30:00+02:00"
                - in: query
                  name: createdUntil
                  schema:
                      type: string
                  description: ISO-8601 date - When the lookup should end (inclusive).
                  example: "2022-04-10T14:30:00+02:00"
            responses:
                '200':
                    description: A successful operation
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                        description: Whether the request was successful
                                        example: true
                                    data:
