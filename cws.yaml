                '400':
                    $ref: '#/components/responses/ResponseErrorBadRequest'
                '500':
                    $ref: '#/components/responses/ResponseErrorInternal'
                '401':
                    $ref: '#/components/responses/ResponseErrorUnauthorized'
                '429':
                    $ref: '#/components/responses/ResponseErrorRateLimitExceeded'

#----------------------------------------------------------------------------------------------------------------------- Components
components:
    securitySchemes:
        bearerAuth:
            description: '
                Bearer token to be obtained from the /auth or /auth/refresh endpoints.
                Should be sent in all subsequent requests in the Authorization header.
                Provide the token with the format `Bearer token`'
            type: http
            scheme: bearer
            bearerFormat: JWT

    responses:
        ResponseToken:
            description: New Token Response
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            success:
                                type: boolean
                                description: Whether the request was successful
                                example: true
                            data:
                                $ref: '#/components/schemas/TokenSchema'

        ResponseTokenAll:
            description: New Token Response with User details and permissions
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            success:
                                type: boolean
                                description: Whether the request was successful
                                example: true
                            data:
                                type: object
                                required:
                                    - authConfig
                                    - userId
                                    - username
                                    - name
                                    - email
                                    - phone
                                    - permissions
                                properties:
                                    authConfig:
                                        $ref: '#/components/schemas/TokenSchema'
                                    userId:
                                        type: string
                                        description: The user UID
                                        example: E7rApNKbg4
                                    username:
                                        type: string
                                        description: The username
                                        example: 'myusername'
                                    name:
                                        type: string
                                        description: The user's name
                                        example: 'John Smith'
                                    email:
                                        type: string
                                        description: The user's email
                                        example: 'john@smith.com'
                                    phone:
                                        type: string
                                        description: The user's phone number
                                        example: '1234567890'
                                    permissions:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/PermissionResponseSchema'

        ResponseSuccess:
            description: A successful operation
            content:
                application/json:
                    schema:
                        type: object
                        description: A success response Object. `data` is always present and is an empty array when there is nothing to return.
                        properties:
                            success:
                                type: boolean
                                description: Whether the request was successful
                                example: true
                            data:
                                type: array
                                description: Always present - an empty array when there is nothing to return
                                items: {}
                                example: []

        ResponseWoCreateSuccess:
            description: |
                Work Order accepted for creation success.

                The information supplied is valid but a Work Order can't be created automatically in real-time because the product information supplied cannot be automaticaly matched to the information in the system.

                The workorder has been put into a queue for manual intervention.
            content:
                application/json:
                    schema:
                        type: object
                        description: A success response Object. `data` is always present and is an empty array when there is nothing to return.
                        properties:
                            success:
                                type: boolean
                                description: Whether the request was successful
                                example: true
                            data:
                                type: array
                                description: Always present - an empty array when there is nothing to return
                                items: {}
                                example: []

        ResponseWoSuccess:
            description: A successful Work Order operation
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            success:
                                type: boolean
                                description: Whether the request was successful
                                example: true
                            data:
                                $ref: '#/components/schemas/WoResponseSchema'

        ResponseWoListSuccess:
            description: Wos list response
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            success:
                                type: boolean
                                description: Whether the request was successful
                                example: true
                            data:
                                $ref: '#/components/schemas/WoListResponseSchema'
        ResponseWoStatsSuccess:
            description: Wos Stats response
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            success:
                                type: boolean
                                description: Whether the request was successful
                                example: true
                            data:
                                $ref: '#/components/schemas/WoStatsResponseSchema'

        ResponseErrorBadRequest:
            description: |
                The request is malformed and needs to be fixed.

                Requests to an unknown path, or to a known path with the wrong method, also return 400 with the error `Unknown action (METHOD:path)`.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorSchema'

        ResponseErrorUnauthorized:
            description: The request is not authorized
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorSchema'

        ResponseErrorInternal:
            description: An unexpected internal error occurred
            content:
                application/json:
                    schema:
                        type: object
                        description: An internal error response Object
                        properties:
                            success:
                                type: boolean
                                description: Whether the request was successful
                                example: false
                            data:
                                type: object
                                properties:
                                    error:
                                        type: string
                                        description: The error message
                                        example: Internal system error

        ResponseErrorRateLimitExceeded:
            description: |
                Too many requests. The API is limited to 60 requests per minute and
                1000 requests per hour per user (per IP for unauthenticated
                endpoints), each over its own sliding window. Rejected requests do
                not consume quota. Wait the number of seconds given in the
                Retry-After header before retrying - it reflects whichever window
                was exceeded.
            headers:
                X-RateLimit-Limit:
                    description: Total request allowance per minute
                    schema:
                        type: integer
                        example: 60
                X-RateLimit-Remaining:
                    description: Requests remaining in the current minute window
                    schema:
                        type: integer
                        example: 0
                X-RateLimit-Reset:
                    description: Unix timestamp when minute allowance starts to free up
                    schema:
                        type: integer
                        example: 1758868800
                X-RateLimit-Limit-Hour:
                    description: Total request allowance per hour
                    schema:
                        type: integer
                        example: 1000
                X-RateLimit-Remaining-Hour:
                    description: Requests remaining in the current hour window
                    schema:
                        type: integer
                        example: 0
                X-RateLimit-Reset-Hour:
                    description: Unix timestamp when hour allowance starts to free up
                    schema:
                        type: integer
                        example: 1758870000
                Retry-After:
                    description: Seconds to wait before retrying
                    schema:
                        type: integer
                        example: 30
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorSchema'

        ResponseInventoryOrderSuccess:
            description: A successful Inventory Order operation
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            success:
                                type: boolean
                                description: Whether the request was successful
                                example: true
                            data:
                                $ref: '#/components/schemas/InventoryOrderGetSchema'
        
        ResponseInventoryPurchaseOrderSuccess:
            description: A successful Inventory Purchase Order operation
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            success:
                                type: boolean
                                description: Whether the request was successful
                                example: true
                            data:
                                $ref: '#/components/schemas/InventoryPurchaseOrderGetSchema'
        
        ResponseInventoryPurchaseOrderItemSuccess:
            description: A successful Inventory Purchase Order operation
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            success:
                                type: boolean
                                description: Whether the request was successful
                                example: true
                            data:
                                $ref: '#/components/schemas/InventoryPurchaseOrderItemGetSchema'

        ResponseInventoryItemSuccess:
            description: A successful Inventory Item operation
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            success:
                                type: boolean
                                description: Whether the request was successful
                                example: true
                            data:
                                $ref: '#/components/schemas/InventoryItemGetSchema'


    schemas:
        AddressSchema:
            type: object
            properties:
                name:
                    type: string
                    example: 'Warehouse 1'
                street1:
                    type: string
                    example: '2 My Fake Street'
                street2:
                    type: string
                    example: 'Street 2'
                suburb:
                    type: string
                    example: 'fake Suburb'
                city:
                    type: string
                    example: 'Syndey'
                state:
                    type: string
                    example: 'NZW'
                postcode:
                    type: number
                    example: '12345'

        AddressResponseSchema:
            allOf:
                - $ref: '#/components/schemas/AddressSchema'
                - type: object
                  properties:
                      country:
                          type: string
                          example: 'Australia'
                      latitude:
                          type: number
                          example: '-27.4529'
                      longitude:
                          type: number
                          example: '153.031'

        TokenSchema:
            type: object
            required:
                - accessToken
                - accessExpiresAt
                - refreshToken
                - refreshExpiresAt
            properties:
                accessToken:
                    type: string
                    description: Your new token
                    example: BqdmioqjlgaSBTIarf8coYFhZfBeqCn82AulZVEkbPdNIVYaa6ny43P4iriJ4FR7gmtgi8AtXOhGKfRVmfuqijvBLOkQtcXKyq0QyBkwqCdaR55dkzEDTaeFYyvsLtcj
                accessExpiresAt:
                    type: string
                    description: ISO-8601 date - When the token will expire
                    example: "2022-04-10T14:30:00+02:00"
                refreshToken:
                    type: string
                    description: Your new token
                    example: BqdmioqjlgaSBTIarf8coYFhZfBeqCn82AulZVEkbPdNIVYaa6ny43P4iriJ4FR7gmtgi8AtXOhGKfRVmfuqijvBLOkQtcXKyq0QyBkwqCdaR55dkzEDTaeFYyvsLtcj
                refreshExpiresAt:
                    type: string
                    description: ISO-8601 date -  When the token will expire
                    example: "2022-04-10T14:30:00+02:00"

        ChargeSchema:
            type: object
            required:
                - chargeDescription
            properties:
                chargeDescription:
                    type: string
                    description: The description of the charge
                    example: 'My Description'
                chargeQuantity:
                    type: integer
                    description: The quantity of the charge. Default 1.
                    example: 1
                chargeUnitPrice:
                    type: number
                    description: The unit price of the charge. Default 0.
                    example: 1.00
                chargeRrp:
                    type: number
                    description: The RRP of the charge
                    example: 1.00

                chargeType:
                    type: string
                    example: Repair
                    default: Other
                    enum:
                        - Repair
                        - Service
                        - Install
                        - Delivery
                        - Pickup
                        - System Mileage
                        - Telephone
                        - Email
                        - Todo
                        - Other
                        - Bonus
                        - Manual Mileage

        ChargeResponseSchema:
            type: object
            required:
                - chargeId
                - chargeDescription
            properties:
                chargeId:
                    type: string
                    description: The UID of the charge
                    example: E7rApNKbg4
                chargeDescription:
                    type: string
                    description: The description of the charge
                    example: 'My Description'
                chargeQuantity:
                    type: integer
                    description: The quantity of the charge
                    example: 1
                chargeUnitPrice:
                    type: number
                    description: The unit price of the charge
                    example: 1.00
                chargeType:
                    type: string
                    description: The name of the charge type
                    example: Repair
        ContactPostSchema:
            type: object
            properties:
                name:
                    type: string
                    example: 'John Smith'
                firstName:
                    type: string
                    example: 'John'
                lastName:
                    type: string
                    example: 'Smith'
                companyName:
                    type: string
                    example: 'ABC Company ltd'
                address:
                    $ref: '#/components/schemas/AddressSchema'
                phone:
                    type: string
                    example: '89349393'
                email:
                    type: string
                    example: 'email1@email.com'

        ContactGetSchema:
