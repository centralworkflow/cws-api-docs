                - Returns the Supplier's active Items that currently have a non-zero stock level, with their stock figures.
                - Results are sorted by Item ident.
            security:
              - bearerAuth: []
            tags:
                - Inventory Supplier Stock Reports
            parameters:
                - in: path
                  name: supplierId
                  required: true
                  schema:
                      type: string
                  description: The UID of the Supplier
                - in: query
                  name: page
                  description: The current page number. Default 1.
                  schema:
                    type: integer
                    default: 1
                - in: query
                  name: pageSize
                  description: The number of items to return Default 20 Max 200
                  schema:
                    type: integer
                    default: 20
                    maximum: 200
                - in: query
                  name: sort
                  description: The sort direction (by Item ident)
                  schema:
                      type: string
                      default: asc
