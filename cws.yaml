                '401':
                    $ref: '#/components/responses/ResponseErrorUnauthorized'
                '429':
                    $ref: '#/components/responses/ResponseErrorRateLimitExceeded'
        post:
            summary: Add a log to a Work Order
            tags:
                - Work Order Logs
            security:
                - bearerAuth: []
            parameters:
                - in: path
                  name: woId
                  schema:
                      type: string
                  required: true
                  description: The UID of the Work Order
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LogSchema'

            responses:
                '200':
                    description: A successful operation - the created log
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                        description: Whether the request was successful
                                        example: true
                                    data:
