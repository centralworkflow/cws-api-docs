                orderRecipient:
                    type: string
                    description: The recipient name of the related Inventory Order
                orderDispatchedAt:
                    type: string
                    description: The dispatch date of the related Inventory Order
                orderTracking:
                    type: string
                    description: The tracking ident of the related Inventory Order
                orderSource:
                    type: string
                    description: The source of the related Inventory Order
                productModel:
                    type: string
