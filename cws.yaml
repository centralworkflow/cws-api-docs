                    description: A successful operation
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                        description: Whether the request was successful
                                        example: true
                                    data:
                                        type: object
                                        properties:
                                            userId:
                                                type: string
                                                description: The user's UID
                                                example: E7rApNKbg4
                                            username:
                                                type: string
                                                description: The user's username
                                                example: 'myUserName'
                                            name:
                                                type: string
                                                description: The user's name
                                                example: 'My Name'
                                            email:
                                                type: string
                                                description: The user's email
                                                example: 'email@domain.com'
                                            phone:
                                                type: string
                                                description: The user's phone number
                                                example: '1234567890'
                '400':
                    $ref: '#/components/responses/ResponseErrorBadRequest'
                '500':
                    $ref: '#/components/responses/ResponseErrorInternal'
                '401':
                    $ref: '#/components/responses/ResponseErrorUnauthorized'
                '429':
                    $ref: '#/components/responses/ResponseErrorRateLimitExceeded'

    /user/permissions:
        get:
            summary: Get information about the currenty authorized user's permissions
            tags:
                - User
            security:
                - bearerAuth: []
            responses:
                '200':
                    description: A successful operation
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                        description: Whether the request was successful
                                        example: true
                                    data:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/PermissionResponseSchema'
                '400':
                    $ref: '#/components/responses/ResponseErrorBadRequest'
                '500':
                    $ref: '#/components/responses/ResponseErrorInternal'
                '401':
                    $ref: '#/components/responses/ResponseErrorUnauthorized'
                '429':
                    $ref: '#/components/responses/ResponseErrorRateLimitExceeded'

    #----------------------------------------------------------------------------------------------------------------------- Work Orders

    /wos:
        get:
            summary: Get a list of all Work Orders.
            tags:
                - Work Orders

            security:
                - bearerAuth: []
            parameters:

                - in: query
                  name: page
                  description: The current page number. Default 1.
                  schema:
                    type: integer
                    default: 1
                - in: query
                  name: pageSize
                  description: The number of workorders to return Default 20 Max 200
                  schema:
                    type: integer
                    default: 20
                    maximum: 200

                - in: query
                  name: sort
                  description: The sort direction
                  schema:
                      type: string
                      default: desc
                      enum: [asc, desc]

                - in: query
                  name: updatedFrom
                  schema:
                      type: string
                  description: ISO-8601 date - When the lookup should start (inclusive).
                  example: "2022-04-10T14:30:00+02:00"
                - in: query
                  name: updatedUntil
                  schema:
                      type: string
                  description: ISO-8601 date - When the lookup should end (inclusive).
                  example: "2022-04-10T14:30:00+02:00"
                - in: query
                  name: createdFrom
                  schema:
                      type: string
                  description: ISO-8601 date - When the lookup should start (inclusive).
                  example: "2022-04-10T14:30:00+02:00"
                - in: query
                  name: createdUntil
                  schema:
                      type: string
                  description: ISO-8601 date - When the lookup should end (inclusive).
                  example: "2022-04-10T14:30:00+02:00"
                
                - in: query
                  name: thirdpartyRef
                  schema:
                      type: string
                  description: A third party reference number to filter by
                - in: query
                  name: ref
                  schema:
                      type: string
                  description: A reference number to filter by
                - in: query
                  name: ids
                  schema:
                      type: string
                  example: E7rApNKbg4,Z7rApNKbg4,T7rApNKbg4
                  description: Specific Work Order IDs to filter the results by
            responses:
                '200':
                    $ref: '#/components/responses/ResponseWoListSuccess'
                '400':
                    $ref: '#/components/responses/ResponseErrorBadRequest'
                '500':
                    $ref: '#/components/responses/ResponseErrorInternal'
                '401':
                    $ref: '#/components/responses/ResponseErrorUnauthorized'
                '429':
                    $ref: '#/components/responses/ResponseErrorRateLimitExceeded'
    /wo-stats:
        get:
            summary: Get a list of all Work Order Statistics.
            tags:
                - Work Orders
            security:
                - bearerAuth: []
            parameters:
                - in: query
                  name: dateFrom
                  required: true
                  schema:
                      type: string
                  description: ISO-8601 date - Only Work Orders updated at or after this date are counted.
                  example: "2022-04-10T14:30:00+02:00"
            responses:
                '200':
                    $ref: '#/components/responses/ResponseWoStatsSuccess'
                '400':
                    $ref: '#/components/responses/ResponseErrorBadRequest'
                '500':
                    $ref: '#/components/responses/ResponseErrorInternal'
                '401':
                    $ref: '#/components/responses/ResponseErrorUnauthorized'
                '429':
                    $ref: '#/components/responses/ResponseErrorRateLimitExceeded'
    /wos/{woId}:
        get:
            summary: Get a Work Order by UID
            tags:
                - Work Orders
            security:
