            parameters:
                - in: path
                  name: woId
                  schema:
                      type: string
                  required: true
                  description: The UID of the Work Order
            responses:
                '200':
                    $ref: '#/components/responses/ResponseWoSuccess'
                '400':
                    $ref: '#/components/responses/ResponseErrorBadRequest'
                '500':
                    $ref: '#/components/responses/ResponseErrorInternal'
                '401':
                    $ref: '#/components/responses/ResponseErrorUnauthorized'
                '429':
                    $ref: '#/components/responses/ResponseErrorRateLimitExceeded'
        patch:
            summary: Update a Work Order
            tags:
                - Work Orders
            security:
                - bearerAuth: []
            parameters:
                - in: path
                  name: woId
                  schema:
                      type: string
                  required: true
                  description: The UID of the Work Order
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/WoPatchSchema'
            responses:
                '200':
                    $ref: '#/components/responses/ResponseWoSuccess'
                '400':
                    $ref: '#/components/responses/ResponseErrorBadRequest'
                '500':
                    $ref: '#/components/responses/ResponseErrorInternal'
                '401':
                    $ref: '#/components/responses/ResponseErrorUnauthorized'
                '429':
                    $ref: '#/components/responses/ResponseErrorRateLimitExceeded'

    /wos/{woId}/statuses:
        get:
            summary: Get a list of valid statuses for a Work Order in it's current state
            tags:
                - Work Order Statuses
            security:
                - bearerAuth: []
            parameters:
                - in: path
                  name: woId
                  schema:
                      type: string
                  required: true
                  description: The UID of the Work Order

            responses:
                '200':
                    description: A successful operation
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                        description: Whether the request was successful
                                        example: true
                                    data:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/WoAvailableStatusSchema'

                '400':
                    $ref: '#/components/responses/ResponseErrorBadRequest'
                '500':
                    $ref: '#/components/responses/ResponseErrorInternal'
                '401':
                    $ref: '#/components/responses/ResponseErrorUnauthorized'
                '429':
                    $ref: '#/components/responses/ResponseErrorRateLimitExceeded'

        put:
            summary: Update the status of a Work Order
            tags:
                - Work Order Statuses
            security:
                - bearerAuth: []
            parameters:
                - in: path
                  name: woId
                  schema:
                      type: string
                  required: true
                  description: The UID of the Work Order
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - statusId
                                - statusType
                            properties:
                                statusId:
                                    type: string
                                    example: E7rApNKbg4

                                statusType:
                                    type: string
                                    description: The status Type
                                    example: 'Open'
                                    enum:
                                        - Open
                                        - Closed
                                        - Cancelled
                                        - Invoiced
                                        - Estimate
            responses:
                '200':
                    description: A successful operation
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                        description: Whether the request was successful
                                        example: true
                                    data:
                                        $ref: '#/components/schemas/StatusResponseSchema'
                '400':
                    $ref: '#/components/responses/ResponseErrorBadRequest'
                '500':
                    $ref: '#/components/responses/ResponseErrorInternal'
                '401':
                    $ref: '#/components/responses/ResponseErrorUnauthorized'
                '429':
                    $ref: '#/components/responses/ResponseErrorRateLimitExceeded'

    /wos/{woId}/logs:
        get:
            summary: Get a list of logs for a Work Order
            tags:
                - Work Order Logs
            security:
                - bearerAuth: []
            parameters:
                - in: path
                  name: woId
                  schema:
                      type: string
                  required: true
                  description: The UID of the Work Order
            responses:
                '200':
                    description: A successful operation
                    content:
