                '400':
                    $ref: '#/components/responses/ResponseErrorBadRequest'
                '500':
                    $ref: '#/components/responses/ResponseErrorInternal'
                '401':
                    $ref: '#/components/responses/ResponseErrorUnauthorized'
                '429':
                    $ref: '#/components/responses/ResponseErrorRateLimitExceeded'

    /wos/{woId}/logs/{logId}:
        get:
            summary: Get a log from a Work Order
            tags:
                - Work Order Logs
            security:
                - bearerAuth: []
            parameters:
                - in: path
                  name: woId
                  schema:
                      type: string
                  required: true
                  description: The UID of the Work Order
                - in: path
                  name: logId
                  schema:
                      type: string
                  required: true
                  description: The UID of the Log
            responses:
